name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка зависимостей
        run: pip install -r requirements.txt
      - name: Линтинг
        run: flake8 src tests --max-line-length=100
      - name: Тесты
        run: python -m pytest