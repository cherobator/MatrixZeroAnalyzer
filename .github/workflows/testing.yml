name: LR4 Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov

      - name: Run regression tests
        run: python -m pytest -v tests/test_non_finite_input.py tests/regression

      - name: Run full suite and check coverage
        run: >-
          python -m pytest -q --cov=src --cov-branch
          --cov-report=term-missing --cov-fail-under=70
